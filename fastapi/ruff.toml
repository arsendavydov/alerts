# Ruff configuration file
# See https://docs.astral.sh/ruff/configuration/

target-version = "py310"
line-length = 79

[lint]
# Enable specific rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PD",  # pandas-vet
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "NPY", # NumPy-specific rules
    "RUF", # Ruff-specific rules
]

ignore = [
    "PLR0913", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "TRY003", # Avoid specifying long messages outside the exception class
    "TRY300", # Consider moving this statement to an else block (не критично)
    "TRY301", # Abstract raise to an inner function (не критично)
    "TRY002", # Create your own exception (не критично, используем стандартные исключения)
    "SIM102", # Use a single if statement instead of nested if (не критично)
    "SIM108", # Use ternary operator (не критично, if-else более читаемо)
    "PLW0603", # Using the global statement (используется для пула БД)
    "B008",  # Do not perform function calls in argument defaults
    "ARG001", # Unused function argument
    "ARG002", # Unused method argument
    "ARG003", # Unused class method argument
    "ARG004", # Unused static method argument
    "ARG005", # Unused lambda argument
    "RUF001", # String contains ambiguous characters (кириллица в строках допустима)
    "RUF002", # Docstring contains ambiguous characters (кириллица в docstrings допустима)
    "RUF003", # Comment contains ambiguous characters (кириллица в комментариях допустима)
    "PLC0415", # Import should be at top-level (в тестах допустимы локальные импорты)
    "SIM117", # Use single with statement (вложенные with для pool.acquire и transaction - нормально)
    "B904", # Blind except (в тестах допустимо)
    "B017", # Assert with exception (в тестах допустимо)
    "PLR0911", # PLR0911: Too many return statements
    "PLR2004", # PLR2004: Magic value used in comparison
    "A001", # A001: Variable is assigned but never used (ложные срабатывания)
    "E722", # E722: Do not use bare except (в некоторых случаях допустимо)
    "RUF100", # Unused noqa (E501 отключён по per-file-ignores, комментарии оставлены)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**" = ["ARG", "PLR2004", "E501", "PLC0415", "ERA001", "PLW0602", "PTH123"]
"**/repositories/**" = ["E501"]  # Long SQL strings
"**/services/**" = ["E501"]  # Long lines in service logic
"**/routers/**" = ["E501", "ERA001"]
"**/schemas/**" = ["E501"]  # Long Pydantic field definitions
"**/utils/**" = ["E501"]
"**/lint/**" = ["E501"]

[lint.isort]
known-first-party = ["app", "repositories", "services", "schemas", "routers", "utils"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
